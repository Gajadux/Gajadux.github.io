<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy Birthday — Surprise</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
  :root{
    --bg-1: #05060a;
    --bg-2: #0f1317;
    --accent-1: #ff7bb0;
    --accent-2: #66d9ff;
    --muted: rgba(255,255,255,0.66);
    --radius: 16px;
    --ease: cubic-bezier(.2,.9,.3,1);
    --max-width: 960px;
  }
  *{box-sizing:border-box}
  html,body,#stage{height:100%}
  body{
    margin:0;
    font-family:Poppins, Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background:
      radial-gradient(800px 400px at 10% 20%, rgba(102,217,255,0.03), transparent),
      radial-gradient(900px 500px at 90% 80%, rgba(255,123,176,0.03), transparent),
      linear-gradient(180deg,var(--bg-1),var(--bg-2));
    color:#fff;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overflow:hidden;
    height:100vh;
  }
  .bg-orbit{ position:fixed; inset:-20% -20% auto auto; width:60vw; height:60vh;
    background: radial-gradient(circle at 30% 30%, rgba(255,123,176,0.07), transparent 20%),
                radial-gradient(circle at 80% 80%, rgba(102,217,255,0.05), transparent 30%);
    filter: blur(60px) saturate(120%); transform: rotate(10deg); z-index:0; pointer-events:none;
    animation: orbit 18s linear infinite;
  }
  @keyframes orbit{ 0%{transform:rotate(0deg)} 50%{transform:rotate(6deg)} 100%{transform:rotate(0deg)} }
  .background-layer{ position:fixed; inset:0; z-index:0;
    background: linear-gradient(120deg, rgba(255,255,255,0.01), transparent 30%),
                linear-gradient(240deg, rgba(255,255,255,0.005), transparent 60%);
    mix-blend-mode:overlay; pointer-events:none; animation: bgfloat 16s var(--ease) infinite; opacity:0.9;
  }
  @keyframes bgfloat{ 0%{transform:translateY(0)}50%{transform:translateY(-18px)}100%{transform:translateY(0)} }
  .centered{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width: min(92%, 820px); max-width:var(--max-width); text-align:center; padding:28px; border-radius:var(--radius); z-index:5;
  }
  .glass-panel{
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(10px) saturate(140%);
    box-shadow: 0 16px 40px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    transition: transform 520ms var(--ease), opacity 420ms var(--ease), filter 520ms var(--ease);
  }
  .hidden{ opacity:0; pointer-events:none; transform: translateY(10px) scale(.996) }
  .revealed{ opacity:1; pointer-events:auto; transform: translateY(0) scale(1); transition: all 520ms var(--ease) }
  .handwriting{ font-family: "Great Vibes", serif; color:#fff; }
  .start-btn{
    font-size: 56px; padding: 14px 44px; border-radius:999px; border:none; cursor:pointer;
    background: linear-gradient(90deg, rgba(255,123,176,0.12), rgba(102,217,255,0.08));
    box-shadow: 0 18px 50px rgba(102,31,63,0.12); transition: transform 300ms var(--ease), box-shadow 300ms var(--ease);
  }
  .start-btn:hover{ transform: translateY(-6px) scale(1.02); box-shadow: 0 28px 70px rgba(102,31,63,0.16) }
  .subtle{ color:var(--muted); margin-top:10px; font-size:14px }
  .lead{ font-size:20px; font-weight:600; margin:0 0 6px }
  .muted{ color:var(--muted); margin-top:0 0 18px }
  .code-row{ display:flex; gap:12px; justify-content:center; align-items:center; margin:18px 0; flex-wrap:wrap; }
  .code-input{
    width:170px; padding:16px 18px; border-radius:12px; border:1px solid rgba(255,255,255,0.06);
    background: linear-gradient(180deg, rgba(0,0,0,0.26), rgba(255,255,255,0.02));
    color:#fff; font-size:20px; text-align:center; outline:none; transition: box-shadow 220ms var(--ease), transform 220ms var(--ease);
  }
  .code-input:focus{ box-shadow: 0 8px 30px rgba(102,217,255,0.06); transform: translateY(-4px); }
  .btn{ padding:12px 18px; border-radius:12px; border:none; background: linear-gradient(90deg,var(--accent-1),var(--accent-2)); color:#081018; font-weight:700; cursor:pointer; transition: transform 180ms var(--ease), filter 180ms var(--ease); }
  .hint{ margin-top:12px; color:rgba(255,255,255,0.95); font-weight:600; }
  .feedback{ margin-top:10px; color:#ffb3c9 }
  .celebration{ padding:28px 32px; max-width:920px; z-index:10; }
  .big-handwriting{
    font-size: clamp(40px, 8vw, 92px); margin: 0 0 14px; letter-spacing: 0.08em; color: #fff; text-transform:uppercase;
    transform-origin:center; transition: transform 820ms var(--ease), filter 820ms var(--ease), opacity 520ms var(--ease);
    filter: drop-shadow(0 18px 40px rgba(0,0,0,0.6)); opacity:0; will-change: transform, filter, opacity;
  }
  .big-handwriting.zoomed{ opacity:1; transform: scale(1.18) translateZ(0); filter: drop-shadow(0 26px 60px rgba(0,0,0,0.7)); }
  .message{ margin-top:8px; font-size:18px; color: rgba(255,255,255,0.96); max-width:880px; line-height:1.6; background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent); padding:18px; border-radius:12px; border:1px solid rgba(255,255,255,0.04); backdrop-filter: blur(6px); opacity:0; transform: translateY(10px) scale(.996); transition: opacity 620ms var(--ease) 320ms, transform 620ms var(--ease) 320ms; }
  .message.visible{ opacity:1; transform: translateY(0) scale(1); }
  .stage.dof .background-layer, .stage.dof .bg-orbit, .stage.dof .panel-unlock, .stage.dof .panel-start{ filter: blur(8px) saturate(60%); transform: scale(1.02); opacity:0.6; transition: all 820ms var(--ease); }
  .stage.dof .glass-panel:not(.celebration){ transform: translateY(8px) scale(.992); opacity:0.18; pointer-events:none; }
  .confetti-canvas{ position:fixed; inset:0; pointer-events:none; z-index:20 }
  @media (max-width:520px){ .start-btn{ font-size:40px; padding:12px 28px } .code-input{ width:130px; font-size:18px; padding:12px 14px} .message{ font-size:16px } }
  </style>
</head>
<body>
  <div id="stage" class="stage">
    <div class="bg-orbit"></div>
    <div class="background-layer"></div>

    <div id="start-screen" class="centered glass-panel panel-start revealed">
      <button id="start-btn" class="handwriting start-btn" aria-label="Start">Start</button>
      <p class="subtle">Tap to begin</p>
    </div>

    <div id="unlock-panel" class="centered glass-panel panel-unlock hidden" role="region" aria-live="polite">
      <p class="lead">Today is someone's special day.</p>
      <p class="muted">Type the correct 4-digit number to unlock a secret about them.</p>
      <div class="code-row">
        <input id="code-input" class="code-input" maxlength="4" inputmode="numeric" pattern="[0-9]*" aria-label="4 digit code" />
        <button id="unlock-btn" class="btn">Unlock</button>
      </div>
      <p id="hint" class="hint hidden"></p>
      <p id="feedback" class="feedback" aria-live="assertive"></p>
    </div>

    <div id="celebration" class="centered celebration hidden" role="dialog" aria-modal="true">
      <h1 id="hb-head" class="handwriting big-handwriting" aria-hidden="true">HAPPY BIRTHDAY MY ANGELINA</h1>
      <div id="message" class="message readable" aria-live="polite"></div>
      <button id="replay" class="btn subtle-btn hidden">Play again</button>
    </div>

    <canvas id="confetti-canvas" class="confetti-canvas hidden" aria-hidden="true"></canvas>
  </div>

  <script>
  // Config
  const CORRECT = "0820";
  const MAX_ATTEMPTS_BEFORE_HINT = 1;
  const birthdayMessage = `Happy birthday to my beautifully cute girl, Angelina 🥹❤️. I’m genuinely so grateful to have you in my life, and I hope you know how much you mean to me. You make me happy in ways you probably don’t even realize, and even through all our jokes, random conversations, teasing, and little moments together, you’ve become someone I care about so deeply. I love your personality and all the little things that make you uniquely you. You’re not just my girlfriend—you’re my favorite person, my comfort, and someone I always want by my side. I hope this new year of your life brings you nothing but happiness, peace, love, and everything your heart desires, because you truly deserve the world. I’m so proud of the woman you are, and I can’t wait to make even more memories with you. Happy birthday, my love. I love you so much, Angelinka, and I hope today makes you feel as special and appreciated as you make me feel every day ❤️🎂`;
  // DOM
  const startScreen = document.getElementById('start-screen');
  const startBtn = document.getElementById('start-btn');
  const unlockPanel = document.getElementById('unlock-panel');
  const codeInput = document.getElementById('code-input');
  const unlockBtn = document.getElementById('unlock-btn');
  const hintEl = document.getElementById('hint');
  const feedbackEl = document.getElementById('feedback');
  const celebration = document.getElementById('celebration');
  const hbHead = document.getElementById('hb-head');
  const messageEl = document.getElementById('message');
  const confettiCanvas = document.getElementById('confetti-canvas');
  const replayBtn = document.getElementById('replay');
  const stage = document.getElementById('stage');
  let attempts = 0;
  function show(el){ el.classList.remove('hidden'); requestAnimationFrame(()=> el.classList.add('revealed')); }
  function hide(el){ el.classList.remove('revealed'); el.classList.add('hidden'); }
  function formatToday(){ const d = new Date(); const mm = String(d.getMonth()+1).padStart(2,'0'); const dd = String(d.getDate()).padStart(2,'0'); return `${mm}/${dd}/${d.getFullYear()}`; }
  startBtn.addEventListener('click', () => {
    startScreen.style.transform = 'translate(-50%,-60%) scale(.98)';
    startScreen.style.opacity = '0';
    setTimeout(()=> { startScreen.style.display = 'none'; show(unlockPanel); codeInput.focus(); }, 420);
  });
  unlockBtn.addEventListener('click', tryUnlock);
  codeInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') tryUnlock(); });
  function tryUnlock(){
    const val = (codeInput.value || "").trim();
    if(!/^\d{4}$/.test(val)){ feedbackEl.textContent = "Please enter a 4-digit number."; return; }
    attempts++;
    if(val === CORRECT){ successUnlock(); } else {
      feedbackEl.textContent = "Incorrect — try again.";
      if(attempts >= MAX_ATTEMPTS_BEFORE_HINT){
        hintEl.textContent = `Hint: Today's date is ${formatToday()}`;
        hintEl.classList.remove('hidden'); requestAnimationFrame(()=> hintEl.classList.add('revealed'));
      }
      unlockPanel.animate([{ transform: 'translateY(0)' },{ transform: 'translateY(-8px)' },{ transform: 'translateY(0)' }], { duration: 320, easing: 'cubic-bezier(.2,.9,.3,1)'});
    }
  }
  async function successUnlock(){
    feedbackEl.textContent = '';
    hide(unlockPanel);
    stage.classList.add('dof');
    show(celebration);
    hbHead.classList.remove('zoomed');
    hbHead.style.transform = 'scale(.86)';
    hbHead.style.opacity = '0';
    await new Promise(r=>setTimeout(r,150));
    hbHead.classList.add('zoomed');
    messageEl.textContent = birthdayMessage;
    await new Promise(r=>setTimeout(r,400));
    messageEl.classList.add('visible');
    startConfetti();
    replayBtn.classList.remove('hidden'); setTimeout(()=> replayBtn.classList.add('revealed'), 140);
  }
  replayBtn.addEventListener('click', () => {
    attempts = 0;
    codeInput.value = ''; hintEl.textContent = ''; feedbackEl.textContent = '';
    messageEl.textContent = ''; messageEl.classList.remove('visible'); hbHead.classList.remove('zoomed');
    hide(celebration); confettiCanvas.classList.add('hidden'); stopConfetti(); stage.classList.remove('dof');
    show(unlockPanel); codeInput.focus();
  });
  /* confetti */
  let confettiCtx, confettiEls = [], confettiRAF, confettiRunning=false;
  function startConfetti(){
    confettiCanvas.classList.remove('hidden'); confettiCanvas.width = innerWidth; confettiCanvas.height = innerHeight;
    confettiCtx = confettiCanvas.getContext('2d'); confettiEls = createConfetti(120); confettiRunning = true; renderConfetti();
  }
  function stopConfetti(){ confettiRunning = false; if(confettiRAF) cancelAnimationFrame(confettiRAF); if(confettiCtx) confettiCtx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height); }
  function createConfetti(count){ const colors = ['#ff6b9f','#ffd166','#66d9ff','#9b94ff','#ffb3c9']; const arr=[]; for(let i=0;i<count;i++){ arr.push({ x: Math.random()*innerWidth, y: Math.random()*-innerHeight, w: 6 + Math.random()*12, h: 8 + Math.random()*14, vx: (Math.random()-0.5)*2.0, vy: 2 + Math.random()*3.5, rot: Math.random()*360, vrot: (Math.random()-0.5)*6, color: colors[Math.floor(Math.random()*colors.length)], drift: Math.random()*0.8 }); } return arr; }
  function renderConfetti(){ if(!confettiRunning) return; confettiCtx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height); for(let p of confettiEls){ p.x += p.vx + Math.sin(p.y*0.01)*p.drift; p.y += p.vy; p.rot += p.vrot; confettiCtx.save(); confettiCtx.translate(p.x, p.y); confettiCtx.rotate(p.rot * Math.PI/180); confettiCtx.fillStyle = p.color; confettiCtx.fillRect(-p.w/2, -p.h/2, p.w, p.h); confettiCtx.restore(); if(p.y > confettiCanvas.height + 60){ p.x = Math.random()*confettiCanvas.width; p.y = -20 - Math.random()*200; p.vy = 2 + Math.random()*3.5; } } confettiRAF = requestAnimationFrame(renderConfetti); }
  window.addEventListener('resize', () => { if(confettiCanvas && !confettiCanvas.classList.contains('hidden')){ confettiCanvas.width = innerWidth; confettiCanvas.height = innerHeight; } });
  </script>
</body>
</html>
