<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy Birthday — Surprise</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage" class="stage">
    <div class="bg-orbit"></div>
    <div class="background-layer"></div>

    <!-- Start screen -->
    <div id="start-screen" class="centered glass-panel panel-start revealed">
      <button id="start-btn" class="handwriting start-btn" aria-label="Start">Start</button>
      <p class="subtle">Tap to begin</p>
    </div>

    <!-- Unlock panel -->
    <div id="unlock-panel" class="centered glass-panel panel-unlock hidden" role="region" aria-live="polite">
      <p class="lead">Today is someone's special day.</p>
      <p class="muted">Type the correct 4-digit number to unlock a secret about them.</p>

      <div class="code-row">
        <input id="code-input" class="code-input" maxlength="4" inputmode="numeric" pattern="[0-9]*" aria-label="4 digit code" />
        <button id="unlock-btn" class="btn">Unlock</button>
      </div>

      <p id="hint" class="hint hidden"></p>
      <p id="feedback" class="feedback" aria-live="assertive"></p>
    </div>

    <!-- Celebration / result -->
    <div id="celebration" class="centered celebration hidden" role="dialog" aria-modal="true">
      <h1 id="hb-head" class="handwriting big-handwriting" aria-hidden="true">HAPPY BIRTHDAY MY ANGELINA</h1>
      <div id="message" class="message readable" aria-live="polite"></div>
      <button id="replay" class="btn subtle-btn hidden">Play again</button>
    </div>

    <canvas id="confetti-canvas" class="confetti-canvas hidden" aria-hidden="true"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
