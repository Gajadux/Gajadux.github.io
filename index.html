<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Angelina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Caveat:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff5f9e;
    --violet:#a06bff;
    --amber:#ffb545;
    --teal:#48e0c8;
    --warm:#fbeefc;
    --glass:rgba(255,255,255,0.045);
    --glass-border:rgba(255,255,255,0.12);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    width:100%;
    overflow:hidden;
    background:#030304;
    font-family:'Quicksand', sans-serif;
    color:var(--warm);
    position:relative;
  }

  #bgCanvas{
    position:fixed;
    inset:0;
    z-index:0;
    display:block;
  }

  /* cursor-following soft spotlight */
  #spotlight{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background: radial-gradient(280px circle at var(--x,50%) var(--y,50%), rgba(255,255,255,0.045), transparent 70%);
  }

  #app{
    position:relative;
    height:100vh;
    width:100vw;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
  }

  /* ---------- Glass card base ---------- */
  .glass-card{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius:30px;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 0 80px rgba(160,107,255,0.05);
    position:relative;
  }
  .glass-card::before{
    content:'';
    position:absolute;
    inset:-1px;
    border-radius:30px;
    padding:1px;
    background:linear-gradient(135deg, rgba(255,255,255,0.4), rgba(255,255,255,0) 40%, rgba(255,255,255,0.1) 100%);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
  }

  /* ---------- Screens (state controlled purely via JS Web Animations) ---------- */
  .screen{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:24px;
  }
  .screen.hidden{
    opacity:0;
    pointer-events:none;
  }

  /* ---------- Screen 1: Start ---------- */
  #screen-start .card{
    padding:56px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
    max-width:480px;
  }
  .pre-title{
    font-size:15px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--violet);
    opacity:0.85;
    font-weight:600;
  }
  #startBtn{
    font-family:'Great Vibes', cursive;
    font-size:52px;
    color:var(--warm);
    background:linear-gradient(135deg, rgba(255,95,158,0.28), rgba(160,107,255,0.22));
    border:1px solid rgba(255,255,255,0.32);
    padding:16px 56px 22px;
    border-radius:100px;
    cursor:pointer;
    letter-spacing:1px;
    transition: transform 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
    animation: pulseGlow 2.6s ease-in-out infinite;
  }
  #startBtn:hover{
    transform:scale(1.06);
    background:linear-gradient(135deg, rgba(255,95,158,0.42), rgba(160,107,255,0.32));
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 0 18px rgba(255,95,158,0.25), 0 0 0 rgba(255,95,158,0);}
    50%{ box-shadow:0 0 36px rgba(255,95,158,0.55), 0 0 12px rgba(160,107,255,0.2);}
  }
  .sub-hint{
    font-size:14px;
    color:rgba(251,238,252,0.5);
    letter-spacing:0.5px;
  }

  /* ---------- Screen 2: Lock ---------- */
  #screen-lock .card{
    padding:52px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    max-width:460px;
    width:88%;
  }
  .lock-line1{
    font-size:22px;
    font-weight:500;
    color:var(--warm);
    line-height:1.5;
  }
  .lock-line2{
    font-size:15.5px;
    color:rgba(251,238,252,0.65);
    line-height:1.6;
    max-width:360px;
  }
  .code-boxes{
    display:flex;
    gap:14px;
    margin-top:8px;
  }
  .code-box{
    width:54px;
    height:66px;
    border-radius:16px;
    background:rgba(255,255,255,0.04);
    border:1.5px solid rgba(255,255,255,0.2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:700;
    color:var(--warm);
    transition: border-color 0.25s ease, background 0.25s ease;
  }
  .code-box.filled{
    border-color:var(--pink);
    background:rgba(255,95,158,0.14);
    box-shadow:0 0 18px rgba(255,95,158,0.28);
  }
  .code-box.bounce{
    animation: boxBounce 0.42s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes boxBounce{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.24) translateY(-7px); }
    65%{ transform:scale(0.93); }
    100%{ transform:scale(1); }
  }
  .code-box.error{
    border-color:#ff5a7a;
    background:rgba(255,90,122,0.14);
  }
  #hiddenInput{
    position:absolute;
    opacity:0;
    pointer-events:none;
  }
  .shake{
    animation: shake 0.45s ease;
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0);}
    20%{ transform:translateX(-10px);}
    40%{ transform:translateX(10px);}
    60%{ transform:translateX(-7px);}
    80%{ transform:translateX(7px);}
  }
  .unlock-btn{
    margin-top:6px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#0a0a0a;
    background:linear-gradient(135deg, var(--pink), var(--violet));
    border:none;
    padding:13px 38px;
    border-radius:100px;
    cursor:pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    box-shadow:0 6px 24px rgba(255,95,158,0.3);
  }
  .unlock-btn:hover{ transform:translateY(-2px); box-shadow:0 8px 30px rgba(255,95,158,0.45); }
  .unlock-btn:active{ transform:translateY(0) scale(0.97); }

  .hint-box{
    font-size:13.5px;
    color:var(--violet);
    opacity:0;
    max-height:0;
    overflow:hidden;
    transition: opacity 0.5s ease, max-height 0.5s ease, margin 0.5s ease;
  }
  .hint-box.show{
    opacity:0.95;
    max-height:60px;
    margin-top:-6px;
  }

  /* ---------- Screen 3: Reveal ---------- */
  #screen-reveal{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
  }
  #screen-reveal .card{
    padding:60px 46px 54px;
    max-width:640px;
    width:92%;
    max-height:86vh;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }
  #screen-reveal .card::-webkit-scrollbar{ width:5px; }
  #screen-reveal .card::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.2); border-radius:10px; }

  #headline{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:clamp(42px, 8vw, 76px);
    color:var(--warm);
    line-height:1.15;
    min-height:1px;
  }
  #headline .line{ display:block; white-space:nowrap; }
  #headline .letter{
    display:inline-block;
    opacity:0;
    transform:translateY(16px) rotate(var(--r,0deg));
    animation: letterWrite 0.5s cubic-bezier(.2,.9,.3,1) forwards;
    text-shadow:
      0 0 10px rgba(255,95,158,0.6),
      0 0 24px rgba(255,95,158,0.4),
      0 0 44px rgba(160,107,255,0.3);
  }
  @keyframes letterWrite{
    0%{ opacity:0; transform:translateY(16px) rotate(var(--r,0deg)) scale(0.8); }
    60%{ opacity:1; }
    100%{ opacity:1; transform:translateY(0) rotate(0deg) scale(1); }
  }

  #message{
    font-size:16.5px;
    line-height:1.85;
    color:rgba(251,238,252,0.92);
    text-align:left;
    opacity:0;
    max-width:520px;
    font-weight:500;
    filter:blur(10px);
    transform:scale(0.94);
    transition: opacity 1.3s cubic-bezier(.4,0,.2,1), filter 1.3s cubic-bezier(.4,0,.2,1), transform 1.3s cubic-bezier(.4,0,.2,1);
  }
  #message.show{ opacity:1; filter:blur(0); transform:scale(1); }

  .signature{
    font-family:'Great Vibes', cursive;
    font-size:32px;
    color:var(--pink);
    opacity:0;
    transition: opacity 1s ease;
    align-self:flex-end;
  }
  .signature.show{ opacity:1; }

  /* confetti burst */
  .burst-piece{
    position:fixed;
    top:50%;
    left:50%;
    width:8px;
    height:8px;
    border-radius:50%;
    pointer-events:none;
    z-index:20;
  }

  /* ---------- Now playing chip ---------- */
  #nowPlaying{
    position:fixed;
    bottom:22px;
    left:22px;
    z-index:30;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 16px 10px 12px;
    border-radius:100px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.14);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
    opacity:0;
    transform:translateY(16px);
    transition:opacity 0.6s ease, transform 0.6s ease;
    max-width:min(78vw, 300px);
  }
  #nowPlaying.show{ opacity:1; transform:translateY(0); }
  .np-icon{
    width:34px;
    height:34px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--pink), var(--violet));
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    font-size:15px;
    animation:npSpin 6s linear infinite;
  }
  @keyframes npSpin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
  .np-bars{ display:flex; align-items:flex-end; gap:2px; height:14px; flex-shrink:0; }
  .np-bars span{ width:3px; background:var(--pink); border-radius:2px; animation:npBar 0.9s ease-in-out infinite; }
  .np-bars span:nth-child(2){ animation-delay:0.15s; background:var(--violet);}
  .np-bars span:nth-child(3){ animation-delay:0.3s; background:var(--amber);}
  @keyframes npBar{ 0%,100%{ height:4px;} 50%{ height:14px;} }
  .np-text{ display:flex; flex-direction:column; text-align:left; overflow:hidden; }
  .np-title{ font-size:12.5px; font-weight:700; color:var(--warm); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np-artist{ font-size:11px; color:rgba(251,238,252,0.55); white-space:nowrap; }
  .np-toggle{
    background:none;
    border:none;
    color:var(--warm);
    opacity:0.7;
    cursor:pointer;
    font-size:16px;
    padding:4px;
    flex-shrink:0;
  }
  .np-toggle:hover{ opacity:1; }

  @media (max-width:480px){
    #screen-start .card, #screen-lock .card{ padding:40px 26px; }
    #startBtn{ font-size:42px; padding:14px 42px 18px; }
    .code-box{ width:46px; height:58px; font-size:24px; }
    #screen-reveal .card{ padding:44px 24px 40px; }
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div id="spotlight"></div>

<div id="app">

  <!-- SCREEN 1: START -->
  <div class="screen" id="screen-start">
    <div class="glass-card card">
      <div class="pre-title">A little something for you</div>
      <button id="startBtn">begin</button>
      <div class="sub-hint">tap to open</div>
    </div>
  </div>

  <!-- SCREEN 2: LOCK -->
  <div class="screen hidden" id="screen-lock">
    <div class="glass-card card">
      <div class="lock-line1">Today is someone's special day 🎈</div>
      <div class="lock-line2">Type the correct 4 digit number to unlock a secret about them.</div>
      <div class="code-boxes" id="codeBoxes">
        <div class="code-box"></div>
        <div class="code-box"></div>
        <div class="code-box"></div>
        <div class="code-box"></div>
      </div>
      <input type="tel" maxlength="4" id="hiddenInput" autocomplete="off" inputmode="numeric">
      <button class="unlock-btn" id="unlockBtn">Unlock</button>
      <div class="hint-box" id="hintBox">💡 Hint: think about today's date...</div>
    </div>
  </div>

  <!-- SCREEN 3: REVEAL -->
  <div class="screen hidden" id="screen-reveal">
    <div class="glass-card card">
      <div id="headline"></div>
      <div id="message"></div>
      <div class="signature" id="signature">— your love</div>
    </div>
  </div>

</div>

<!-- Now playing chip -->
<div id="nowPlaying">
  <div class="np-icon">🎵</div>
  <div class="np-bars"><span></span><span></span><span></span></div>
  <div class="np-text">
    <div class="np-title">Summertime Sadness</div>
    <div class="np-artist">Lana Del Rey</div>
  </div>
  <button class="np-toggle" id="npToggle">🔊</button>
</div>

<!-- Hidden YouTube audio player -->
<div id="yt-player" style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden;bottom:0;left:0;"></div>

<script>
/* =========================================================
   Immersive black canvas background: drifting colorful
   bokeh glow + smooth twinkling dust particles
   ========================================================= */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W, H, DPR;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

const palette = [
  {r:255, g:95,  b:158},  // pink
  {r:160, g:107, b:255},  // violet
  {r:255, g:181, b:69},   // amber
  {r:72,  g:224, b:200},  // teal
];

/* big soft bokeh blobs, slow organic drift */
const bokeh = [];
const BOKEH_COUNT = 7;
for(let i=0;i<BOKEH_COUNT;i++){
  const c = palette[i % palette.length];
  bokeh.push({
    x: Math.random()*W,
    y: Math.random()*H,
    baseR: 160 + Math.random()*180,
    color: c,
    angle: Math.random()*Math.PI*2,
    speed: 0.06 + Math.random()*0.09,
    orbit: 60 + Math.random()*120,
    pulseSpeed: 0.4 + Math.random()*0.5,
    pulseOffset: Math.random()*Math.PI*2,
    ox: Math.random()*W,
    oy: Math.random()*H
  });
}

/* fine twinkling dust particles, drifting slowly upward with sway */
const dust = [];
const DUST_COUNT = 90;
for(let i=0;i<DUST_COUNT;i++){
  const c = palette[Math.floor(Math.random()*palette.length)];
  dust.push({
    x: Math.random()*W,
    y: Math.random()*H,
    r: 0.8 + Math.random()*2,
    color:c,
    speedY: 6 + Math.random()*14, // px per second upward
    swayAmp: 10 + Math.random()*24,
    swaySpeed: 0.2 + Math.random()*0.4,
    swayOffset: Math.random()*Math.PI*2,
    twinkleSpeed: 0.5 + Math.random()*1.2,
    twinkleOffset: Math.random()*Math.PI*2,
    baseAlpha: 0.35 + Math.random()*0.5
  });
}

let lastTime = performance.now();

function drawFrame(now){
  const dt = Math.min((now - lastTime)/1000, 0.05);
  lastTime = now;
  const t = now/1000;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#030304';
  ctx.fillRect(0,0,W,H);

  /* bokeh layer - additive glow */
  ctx.globalCompositeOperation = 'lighter';
  bokeh.forEach(b=>{
    b.angle += b.speed * dt;
    const x = b.ox + Math.cos(b.angle) * b.orbit;
    const y = b.oy + Math.sin(b.angle*0.8) * b.orbit;
    const pulse = 1 + 0.18*Math.sin(t*b.pulseSpeed + b.pulseOffset);
    const r = b.baseR * pulse;
    const grad = ctx.createRadialGradient(x,y,0,x,y,r);
    grad.addColorStop(0, `rgba(${b.color.r},${b.color.g},${b.color.b},0.20)`);
    grad.addColorStop(0.5, `rgba(${b.color.r},${b.color.g},${b.color.b},0.08)`);
    grad.addColorStop(1, `rgba(${b.color.r},${b.color.g},${b.color.b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
  });

  /* dust layer */
  dust.forEach(d=>{
    d.y -= d.speedY * dt;
    if(d.y < -10){
      d.y = H + 10;
      d.x = Math.random()*W;
    }
    const sway = Math.sin(t*d.swaySpeed + d.swayOffset) * d.swayAmp;
    const x = d.x + sway;
    const twinkle = 0.5 + 0.5*Math.sin(t*d.twinkleSpeed + d.twinkleOffset);
    const alpha = d.baseAlpha * twinkle;
    const grad = ctx.createRadialGradient(x,d.y,0,x,d.y,d.r*5);
    grad.addColorStop(0, `rgba(${d.color.r},${d.color.g},${d.color.b},${alpha})`);
    grad.addColorStop(1, `rgba(${d.color.r},${d.color.g},${d.color.b},0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x,d.y,d.r*5,0,Math.PI*2);
    ctx.fill();
  });

  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(drawFrame);
}
requestAnimationFrame(drawFrame);

/* ---------------- Cursor spotlight ---------------- */
const spotlight = document.getElementById('spotlight');
window.addEventListener('pointermove', (e)=>{
  spotlight.style.setProperty('--x', e.clientX + 'px');
  spotlight.style.setProperty('--y', e.clientY + 'px');
});

/* =========================================================
   Screen transitions via Web Animations API (real zoom+blur)
   ========================================================= */
const screenStart = document.getElementById('screen-start');
const screenLock = document.getElementById('screen-lock');
const screenReveal = document.getElementById('screen-reveal');

function transitionTo(hideEl, showEl, onMidpoint){
  hideEl.style.pointerEvents = 'none';
  const hideAnim = hideEl.animate([
    { transform:'scale(1)', filter:'blur(0px)', opacity:1 },
    { transform:'scale(1.7)', filter:'blur(34px)', opacity:0 }
  ], { duration:750, easing:'cubic-bezier(.5,0,.75,0)', fill:'forwards' });

  hideAnim.onfinish = ()=>{
    hideEl.classList.add('hidden');
    showEl.classList.remove('hidden');
    if(onMidpoint) onMidpoint();
    showEl.animate([
      { transform:'scale(0.65)', filter:'blur(34px)', opacity:0 },
      { transform:'scale(1)', filter:'blur(0px)', opacity:1 }
    ], { duration:850, easing:'cubic-bezier(.16,1,.3,1)', fill:'forwards' });
  };
}

/* ---------------- Screen 1 -> 2 ---------------- */
const startBtn = document.getElementById('startBtn');

startBtn.addEventListener('click', ()=>{
  startMusic();
  startBtn.style.pointerEvents = 'none';
  transitionTo(screenStart, screenLock, ()=>{
    setTimeout(()=> hiddenInput.focus(), 250);
  });
});

/* ---------------- Screen 2: code lock ---------------- */
const CODE = "0820";
const hiddenInput = document.getElementById('hiddenInput');
const codeBoxes = document.querySelectorAll('.code-box');
const hintBox = document.getElementById('hintBox');
const unlockBtn = document.getElementById('unlockBtn');
let failedOnce = false;
let prevLength = 0;

document.getElementById('screen-lock').addEventListener('click', (e)=>{
  if(e.target.id !== 'unlockBtn') hiddenInput.focus();
});

hiddenInput.addEventListener('input', ()=>{
  let val = hiddenInput.value.replace(/[^0-9]/g,'').slice(0,4);
  hiddenInput.value = val;
  codeBoxes.forEach((box, i)=>{
    box.classList.remove('error');
    const digit = val[i];
    box.textContent = digit ? digit : '';
    box.classList.toggle('filled', !!digit);
    if(digit && i === val.length - 1 && val.length > prevLength){
      box.classList.remove('bounce');
      void box.offsetWidth;
      box.classList.add('bounce');
    }
  });
  prevLength = val.length;
  if(val.length === 4){
    setTimeout(checkCode, 200);
  }
});

unlockBtn.addEventListener('click', checkCode);

function checkCode(){
  const val = hiddenInput.value;
  if(val.length < 4) { hiddenInput.focus(); return; }
  if(val === CODE){
    revealSequence();
  } else {
    codeBoxes.forEach(box => box.classList.add('error'));
    document.getElementById('codeBoxes').classList.add('shake');
    setTimeout(()=> document.getElementById('codeBoxes').classList.remove('shake'), 450);
    setTimeout(()=>{
      hiddenInput.value = '';
      prevLength = 0;
      codeBoxes.forEach(box=>{ box.textContent=''; box.classList.remove('filled','error'); });
      hiddenInput.focus();
    }, 550);
    if(!failedOnce){
      failedOnce = true;
      hintBox.classList.add('show');
    }
  }
}

/* ---------------- Screen 2 -> 3 reveal sequence ---------------- */
function revealSequence(){
  transitionTo(screenLock, screenReveal, ()=>{
    setTimeout(typeHeadline, 150);
  });
}

function buildHandwrittenLine(text){
  const line = document.createElement('span');
  line.className = 'line';
  [...text].forEach((ch)=>{
    const span = document.createElement('span');
    span.className = 'letter';
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.setProperty('--r', (Math.random()*16 - 8) + 'deg');
    line.appendChild(span);
  });
  return line;
}

function typeHeadline(){
  const headline = document.getElementById('headline');
  headline.innerHTML = '';
  const line1 = buildHandwrittenLine('HAPPY BIRTHDAY');
  const line2 = buildHandwrittenLine('MY ANGELINA');
  headline.appendChild(line1);
  headline.appendChild(line2);

  const allLetters = headline.querySelectorAll('.letter');
  allLetters.forEach((el, i)=>{
    el.style.animationDelay = (i * 0.055) + 's';
  });

  const totalDelay = allLetters.length * 55 + 500;
  setTimeout(showMessage, totalDelay);
}

function showMessage(){
  const msg = document.getElementById('message');
  const text = "Happy birthday to my beautifully cute girl, Angelina \u{1F97A}\u2764\uFE0F. I\u2019m genuinely so grateful to have you in my life, and I hope you know how much you mean to me. You make me happy in ways you probably don\u2019t even realize, and even through all our jokes, random conversations, teasing, and little moments together, you\u2019ve become someone I care about so deeply. I love your personality and all the little things that make you uniquely you. You\u2019re not just my girlfriend\u2014you\u2019re my favorite person, my comfort, and someone I always want by my side. I hope this new year of your life brings you nothing but happiness, peace, love, and everything your heart desires, because you truly deserve the world. I\u2019m so proud of the woman you are, and I can\u2019t wait to make even more memories with you. Happy birthday, my love. I love you so much, Angelinka, and I hope today makes you feel as special and appreciated as you make me feel every day \u2764\uFE0F\uD83C\uDF82";
  msg.textContent = text;
  setTimeout(()=>{
    msg.classList.add('show');
    launchConfetti();
    setTimeout(()=>{
      document.getElementById('signature').classList.add('show');
    }, 900);
  }, 300);
}

/* ---------------- Confetti / heart burst ---------------- */
function launchConfetti(){
  const colors = ['#ff5f9e','#a06bff','#ffb545','#48e0c8','#fbeefc'];
  for(let i=0;i<55;i++){
    const piece = document.createElement('div');
    piece.className = 'burst-piece';
    const color = colors[Math.floor(Math.random()*colors.length)];
    piece.style.background = color;
    piece.style.boxShadow = `0 0 8px ${color}`;
    document.body.appendChild(piece);
    const angle = Math.random()*Math.PI*2;
    const distance = 150 + Math.random()*350;
    const x = Math.cos(angle)*distance;
    const y = Math.sin(angle)*distance - 100;
    const rotate = Math.random()*720 - 360;
    const duration = 1200 + Math.random()*900;
    piece.animate([
      { transform: 'translate(-50%,-50%) rotate(0deg) scale(1)', opacity:1 },
      { transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${rotate}deg) scale(0.3)`, opacity:0 }
    ], { duration: duration, easing:'cubic-bezier(.15,.6,.35,1)' });
    setTimeout(()=> piece.remove(), duration + 100);
  }
}

/* =========================================================
   Background music — Lana Del Rey, "Summertime Sadness"
   played via the official YouTube embed (audio only, hidden player)
   ========================================================= */
let ytPlayer = null;
let ytReady = false;
let pendingPlay = false;
let musicMuted = false;

const ytApiTag = document.createElement('script');
ytApiTag.src = "https://www.youtube.com/iframe_api";
document.body.appendChild(ytApiTag);

window.onYouTubeIframeAPIReady = function(){
  ytPlayer = new YT.Player('yt-player', {
    videoId: 'TdrL3QxjyVw',
    playerVars: { autoplay:0, controls:0, disablekb:1, modestbranding:1, rel:0, playsinline:1 },
    events: {
      'onReady': ()=>{
        ytReady = true;
        if(pendingPlay) playMusicNow();
      }
    }
  });
};

function startMusic(){
  if(ytReady){
    playMusicNow();
  } else {
    pendingPlay = true;
  }
}

function playMusicNow(){
  try{
    ytPlayer.playVideo();
    document.getElementById('nowPlaying').classList.add('show');
  }catch(e){ /* embed may be blocked by browser/ad-blocker; page still works fine without it */ }
}

document.getElementById('npToggle').addEventListener('click', ()=>{
  if(!ytPlayer) return;
  musicMuted = !musicMuted;
  if(musicMuted){
    ytPlayer.mute();
    document.getElementById('npToggle').textContent = '🔈';
  } else {
    ytPlayer.unMute();
    document.getElementById('npToggle').textContent = '🔊';
  }
});

/* keep focus on mobile taps */
document.addEventListener('touchstart', ()=>{}, {passive:true});
</script>
