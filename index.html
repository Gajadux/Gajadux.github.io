<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Angelina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0a0a14;
    --bg-2:#1a1030;
    --pink:#ff6fa5;
    --lilac:#c9a7ff;
    --warm:#ffe3ec;
    --glass:rgba(255,255,255,0.06);
    --glass-border:rgba(255,255,255,0.16);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    width:100%;
    overflow:hidden;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(255,111,165,0.16), transparent 55%),
      radial-gradient(ellipse at 80% 15%, rgba(201,167,255,0.16), transparent 55%),
      radial-gradient(ellipse at 50% 90%, rgba(255,111,165,0.10), transparent 60%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2) 60%, var(--bg-1));
    font-family:'Quicksand', sans-serif;
    color:var(--warm);
    position:relative;
  }

  #app{
    position:relative;
    height:100vh;
    width:100vw;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---------- Ambient floating particles ---------- */
  .particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:1;
  }
  .particle{
    position:absolute;
    bottom:-10%;
    font-size:18px;
    opacity:0;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 0 6px rgba(255,111,165,0.5));
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) translateX(0) rotate(0deg) scale(0.8); opacity:0;}
    10%{ opacity:0.85;}
    50%{ transform:translateY(-55vh) translateX(20px) rotate(180deg) scale(1);}
    90%{ opacity:0.6;}
    100%{ transform:translateY(-110vh) translateX(-15px) rotate(360deg) scale(0.9); opacity:0;}
  }

  /* ---------- Glass card base ---------- */
  .glass-card{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border-radius:28px;
    box-shadow:
      0 8px 40px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.15),
      inset 0 0 60px rgba(255,111,165,0.04);
  }

  /* ---------- Screens ---------- */
  .screen{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:5;
    text-align:center;
    padding:24px;
    transition: opacity 0.8s ease, transform 0.8s ease, filter 0.8s ease;
  }
  .screen.hidden{
    opacity:0;
    pointer-events:none;
    transform:scale(0.92);
    filter:blur(10px);
  }
  .screen.exiting{
    opacity:0;
    transform:scale(1.15);
    filter:blur(14px);
  }

  /* ---------- Screen 1: Start ---------- */
  #screen-start .card{
    padding:56px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
    max-width:480px;
  }
  .pre-title{
    font-size:15px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--lilac);
    opacity:0.8;
    font-weight:600;
  }
  #startBtn{
    font-family:'Great Vibes', cursive;
    font-size:52px;
    color:var(--warm);
    background:linear-gradient(135deg, rgba(255,111,165,0.28), rgba(201,167,255,0.22));
    border:1px solid rgba(255,255,255,0.35);
    padding:16px 56px 22px;
    border-radius:100px;
    cursor:pointer;
    letter-spacing:1px;
    box-shadow: 0 0 0 rgba(255,111,165,0.5);
    transition: transform 0.35s ease, box-shadow 0.35s ease, background 0.35s ease;
    animation: pulseGlow 2.6s ease-in-out infinite;
  }
  #startBtn:hover{
    transform:scale(1.06);
    background:linear-gradient(135deg, rgba(255,111,165,0.4), rgba(201,167,255,0.32));
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 0 18px rgba(255,111,165,0.25), 0 0 0 rgba(255,111,165,0);}
    50%{ box-shadow:0 0 34px rgba(255,111,165,0.55), 0 0 10px rgba(255,111,165,0.15);}
  }
  .sub-hint{
    font-size:14px;
    color:rgba(255,227,236,0.55);
    letter-spacing:0.5px;
  }

  /* ---------- Screen 2: Lock ---------- */
  #screen-lock .card{
    padding:52px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    max-width:460px;
    width:88%;
  }
  .lock-line1{
    font-size:22px;
    font-weight:500;
    color:var(--warm);
    line-height:1.5;
  }
  .lock-line2{
    font-size:15.5px;
    color:rgba(255,227,236,0.7);
    line-height:1.6;
    max-width:360px;
  }
  .code-boxes{
    display:flex;
    gap:14px;
    margin-top:8px;
  }
  .code-box{
    width:52px;
    height:64px;
    border-radius:16px;
    background:rgba(255,255,255,0.05);
    border:1.5px solid rgba(255,255,255,0.25);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:600;
    color:var(--warm);
    transition: border-color 0.25s ease, transform 0.15s ease, background 0.25s ease;
  }
  .code-box.filled{
    border-color:var(--pink);
    background:rgba(255,111,165,0.12);
  }
  .code-box.error{
    border-color:#ff5a7a;
    background:rgba(255,90,122,0.14);
  }
  #hiddenInput{
    position:absolute;
    opacity:0;
    pointer-events:none;
  }
  .shake{
    animation: shake 0.45s ease;
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0);}
    20%{ transform:translateX(-10px);}
    40%{ transform:translateX(10px);}
    60%{ transform:translateX(-7px);}
    80%{ transform:translateX(7px);}
  }
  .unlock-btn{
    margin-top:6px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--bg-1);
    background:linear-gradient(135deg, var(--pink), var(--lilac));
    border:none;
    padding:13px 38px;
    border-radius:100px;
    cursor:pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    box-shadow:0 6px 24px rgba(255,111,165,0.3);
  }
  .unlock-btn:hover{ transform:translateY(-2px); box-shadow:0 8px 30px rgba(255,111,165,0.45); }
  .unlock-btn:active{ transform:translateY(0); }

  .hint-box{
    font-size:13.5px;
    color:var(--lilac);
    opacity:0;
    max-height:0;
    overflow:hidden;
    transition: opacity 0.5s ease, max-height 0.5s ease, margin 0.5s ease;
  }
  .hint-box.show{
    opacity:0.9;
    max-height:60px;
    margin-top:-6px;
  }

  /* ---------- Screen 3: Reveal ---------- */
  #screen-reveal{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:0;
  }
  #screen-reveal .card{
    padding:60px 46px 54px;
    max-width:640px;
    width:92%;
    max-height:86vh;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
  }
  #screen-reveal .card::-webkit-scrollbar{ width:5px; }
  #screen-reveal .card::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.2); border-radius:10px; }

  #headline{
    font-family:'Great Vibes', cursive;
    font-size:0;
    color:var(--warm);
    line-height:1.25;
    text-shadow:0 0 30px rgba(255,111,165,0.35);
    min-height:1px;
    opacity:0;
    transform:scale(0.7);
  }
  #headline.pop{
    animation: zoomPop 0.9s cubic-bezier(.22,1.2,.36,1) forwards;
  }
  @keyframes zoomPop{
    0%{ opacity:0; transform:scale(0.4); }
    60%{ opacity:1; transform:scale(1.08); }
    100%{ opacity:1; transform:scale(1); }
  }
  #headline .typed{
    font-size:clamp(38px, 7vw, 68px);
  }
  .cursor{
    display:inline-block;
    width:3px;
    background:var(--pink);
    margin-left:3px;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  #message{
    font-size:16.5px;
    line-height:1.85;
    color:rgba(255,227,236,0.92);
    text-align:left;
    opacity:0;
    max-width:520px;
    font-weight:500;
    transition: opacity 1.2s ease 0.3s;
  }
  #message.show{ opacity:1; }

  .signature{
    font-family:'Great Vibes', cursive;
    font-size:32px;
    color:var(--pink);
    opacity:0;
    transition: opacity 1s ease;
    align-self:flex-end;
  }
  .signature.show{ opacity:1; }

  /* confetti burst */
  .burst-piece{
    position:fixed;
    top:50%;
    left:50%;
    width:8px;
    height:8px;
    border-radius:50%;
    pointer-events:none;
    z-index:20;
  }

  @media (max-width:480px){
    #screen-start .card, #screen-lock .card{ padding:40px 26px; }
    #startBtn{ font-size:42px; padding:14px 42px 18px; }
    .code-box{ width:44px; height:56px; font-size:24px; }
    #screen-reveal .card{ padding:44px 24px 40px; }
  }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div id="app">

  <!-- SCREEN 1: START -->
  <div class="screen" id="screen-start">
    <div class="glass-card card">
      <div class="pre-title">A little something for you</div>
      <button id="startBtn">begin</button>
      <div class="sub-hint">tap to open</div>
    </div>
  </div>

  <!-- SCREEN 2: LOCK -->
  <div class="screen hidden" id="screen-lock">
    <div class="glass-card card">
      <div class="lock-line1">Today is someone's special day 🎈</div>
      <div class="lock-line2">Type the correct 4 digit number to unlock a secret about them.</div>
      <div class="code-boxes" id="codeBoxes">
        <div class="code-box"></div>
        <div class="code-box"></div>
        <div class="code-box"></div>
        <div class="code-box"></div>
      </div>
      <input type="tel" maxlength="4" id="hiddenInput" autocomplete="off" inputmode="numeric">
      <button class="unlock-btn" id="unlockBtn">Unlock</button>
      <div class="hint-box" id="hintBox">💡 Hint: think about today's date...</div>
    </div>
  </div>

  <!-- SCREEN 3: REVEAL -->
  <div class="screen hidden" id="screen-reveal">
    <div class="glass-card card">
      <div id="headline"></div>
      <div id="message"></div>
      <div class="signature" id="signature">— your love</div>
    </div>
  </div>

</div>

<script>
/* ---------------- Ambient particles (hearts) ---------------- */
const particlesContainer = document.getElementById('particles');
const emojis = ['🌸','💗','✨','🎈','💫'];
function spawnParticle(){
  const p = document.createElement('div');
  p.className = 'particle';
  p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
  const left = Math.random()*100;
  const duration = 9 + Math.random()*8;
  const size = 14 + Math.random()*16;
  p.style.left = left + 'vw';
  p.style.fontSize = size + 'px';
  p.style.animationDuration = duration + 's';
  particlesContainer.appendChild(p);
  setTimeout(()=> p.remove(), duration*1000 + 500);
}
setInterval(spawnParticle, 700);
for(let i=0;i<10;i++) setTimeout(spawnParticle, i*300);

/* ---------------- Screen transition helper ---------------- */
function switchScreen(hideEl, showEl){
  hideEl.classList.add('exiting');
  setTimeout(()=>{
    hideEl.classList.add('hidden');
    hideEl.classList.remove('exiting');
    showEl.classList.remove('hidden');
  }, 750);
}

/* ---------------- Screen 1 -> 2 ---------------- */
const screenStart = document.getElementById('screen-start');
const screenLock = document.getElementById('screen-lock');
const screenReveal = document.getElementById('screen-reveal');

document.getElementById('startBtn').addEventListener('click', ()=>{
  switchScreen(screenStart, screenLock);
  setTimeout(()=> hiddenInput.focus(), 800);
});

/* ---------------- Screen 2: code lock ---------------- */
const CODE = "0820";
const hiddenInput = document.getElementById('hiddenInput');
const codeBoxes = document.querySelectorAll('.code-box');
const hintBox = document.getElementById('hintBox');
const unlockBtn = document.getElementById('unlockBtn');
let failedOnce = false;

document.getElementById('screen-lock').addEventListener('click', (e)=>{
  if(e.target.id !== 'unlockBtn') hiddenInput.focus();
});

hiddenInput.addEventListener('input', ()=>{
  let val = hiddenInput.value.replace(/[^0-9]/g,'').slice(0,4);
  hiddenInput.value = val;
  codeBoxes.forEach((box, i)=>{
    box.classList.remove('error');
    box.textContent = val[i] ? '•' : '';
    box.classList.toggle('filled', !!val[i]);
  });
  if(val.length === 4){
    setTimeout(checkCode, 150);
  }
});

unlockBtn.addEventListener('click', checkCode);

function checkCode(){
  const val = hiddenInput.value;
  if(val.length < 4) { hiddenInput.focus(); return; }
  if(val === CODE){
    revealSequence();
  } else {
    codeBoxes.forEach(box => box.classList.add('error'));
    document.getElementById('codeBoxes').classList.add('shake');
    setTimeout(()=> document.getElementById('codeBoxes').classList.remove('shake'), 450);
    setTimeout(()=>{
      hiddenInput.value = '';
      codeBoxes.forEach(box=>{ box.textContent=''; box.classList.remove('filled','error'); });
      hiddenInput.focus();
    }, 500);
    if(!failedOnce){
      failedOnce = true;
      hintBox.classList.add('show');
    }
  }
}

/* ---------------- Screen 2 -> 3 reveal sequence ---------------- */
function revealSequence(){
  switchScreen(screenLock, screenReveal);
  setTimeout(()=>{
    typeHeadline();
  }, 900);
}

function typeHeadline(){
  const headline = document.getElementById('headline');
  headline.classList.add('pop');
  headline.style.fontSize = '';
  const fullText = "HAPPY BIRTHDAY\nMY ANGELINA";
  headline.innerHTML = '<span class="typed"></span><span class="cursor">&nbsp;</span>';
  const typedSpan = headline.querySelector('.typed');
  let i = 0;
  function typeChar(){
    if(i <= fullText.length){
      typedSpan.innerHTML = fullText.slice(0, i).replace(/\n/g, '<br>');
      i++;
      setTimeout(typeChar, 65);
    } else {
      headline.querySelector('.cursor').style.display = 'none';
      showMessage();
    }
  }
  setTimeout(typeChar, 400);
}

function showMessage(){
  const msg = document.getElementById('message');
  const text = "Happy birthday to my beautifully cute girl, Angelina 🥹❤️. I’m genuinely so grateful to have you in my life, and I hope you know how much you mean to me. You make me happy in ways you probably don’t even realize, and even through all our jokes, random conversations, teasing, and little moments together, you’ve become someone I care about so deeply. I love your personality and all the little things that make you uniquely you. You’re not just my girlfriend—you’re my favorite person, my comfort, and someone I always want by my side. I hope this new year of your life brings you nothing but happiness, peace, love, and everything your heart desires, because you truly deserve the world. I’m so proud of the woman you are, and I can’t wait to make even more memories with you. Happy birthday, my love. I love you so much, Angelinka, and I hope today makes you feel as special and appreciated as you make me feel every day ❤️🎂";
  msg.textContent = text;
  setTimeout(()=>{
    msg.classList.add('show');
    launchConfetti();
    setTimeout(()=>{
      document.getElementById('signature').classList.add('show');
    }, 900);
  }, 300);
}

/* ---------------- Confetti / heart burst ---------------- */
function launchConfetti(){
  const colors = ['#ff6fa5','#c9a7ff','#ffe3ec','#ff9ec7'];
  for(let i=0;i<50;i++){
    const piece = document.createElement('div');
    piece.className = 'burst-piece';
    const color = colors[Math.floor(Math.random()*colors.length)];
    piece.style.background = color;
    piece.style.boxShadow = `0 0 8px ${color}`;
    document.body.appendChild(piece);
    const angle = Math.random()*Math.PI*2;
    const distance = 150 + Math.random()*350;
    const x = Math.cos(angle)*distance;
    const y = Math.sin(angle)*distance - 100;
    const rotate = Math.random()*720 - 360;
    const duration = 1200 + Math.random()*900;
    piece.animate([
      { transform: 'translate(-50%,-50%) rotate(0deg) scale(1)', opacity:1 },
      { transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${rotate}deg) scale(0.3)`, opacity:0 }
    ], { duration: duration, easing:'cubic-bezier(.15,.6,.35,1)' });
    setTimeout(()=> piece.remove(), duration + 100);
  }
}

/* keep focus on mobile taps */
document.addEventListener('touchstart', ()=>{}, {passive:true});
</script>

</body>
</html>
